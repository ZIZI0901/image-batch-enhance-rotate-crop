[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-batch-enhance-rotate-crop"
version = "0.1.0"
description = "Batch image enhancement, rotation, and cropping tool."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["computer-vision", "image-processing", "opencv", "batch-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
image-batch-process = "image_batch_enhance_rotate_crop.cli:main"
image-batch-process-gui = "image_batch_enhance_rotate_crop.ui:main"

[project.urls]
Homepage = "https://github.com/ZIZI0901/image-batch-enhance-rotate-crop"
Issues = "https://github.com/ZIZI0901/image-batch-enhance-rotate-crop/issues"

[tool.setuptools.packages.find]
where = ["src"]
